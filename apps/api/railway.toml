[build]
builder = "nixpacks"
buildCommand = "cd ../.. && pnpm install && pnpm db:generate && pnpm build --filter=@leadcrm/api"

[deploy]
startCommand = "node dist/main.js"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[[services]]
name = "api"
internalPort = 3003
