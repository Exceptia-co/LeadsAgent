# Railway configuration for LeadsCRM API
# 
# IMPORTANTE: En Railway Dashboard, configura:
#   - Root Directory: / (raiz del repositorio, NO apps/api)
#   - O usa el railway.toml en la raiz del proyecto
#
# Este archivo es para referencia. El archivo principal esta en la raiz.

[build]
builder = "nixpacks"
# Si Root Directory es apps/api, este comando navega a la raiz
buildCommand = "cd ../.. && pnpm install --frozen-lockfile && pnpm db:generate && pnpm build --filter=@leadcrm/api"

[deploy]
startCommand = "node dist/main.js"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[[services]]
name = "api"
internalPort = 3003
