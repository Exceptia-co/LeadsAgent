services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: leadscrm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: leadscrm
    ports:
      - "5433:5432"  # Puerto 5433 externo para evitar conflicto con PostgreSQL local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leadscrm"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: leadscrm-redis
    restart: unless-stopped
    ports:
      - "6381:6379"  # Puerto 6381 externo para evitar conflicto con Redis local
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Adminer - Database GUI (opcional, útil para desarrollo)
  adminer:
    image: adminer:latest
    container_name: leadscrm-adminer
    restart: unless-stopped
    ports:
      - "8085:8080"  # Puerto 8085 externo para evitar conflictos
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: leadscrm-network
