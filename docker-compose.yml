services:
  # Redis Cache (única dependencia Docker — DB es Supabase cloud)
  redis:
    image: redis:7-alpine
    container_name: leadscrm-redis
    restart: unless-stopped
    ports:
      - "6381:6379"  # Puerto 6381 externo para evitar conflicto con Redis local
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
    driver: local
