name: Infra Audit

# Runs the scripts/audit-infra.ts smoke test against the live Supabase/Hetzner/Vercel
# infrastructure and against code-level invariants declared in PRD-ESTABILIZACION.md.
#
# Current policy (April 2026):
#   - PRs and pushes on main/develop trigger an informational run (continue-on-error: true).
#   - Weekly cron (Mon 06:00 UTC) provides a drift signal even without repo activity.
#   - Flip `continue-on-error` to `false` once Fase 0 of the PRD is complete
#     so that a single FAIL becomes a required-check blocker.
#
# Secrets required to exercise each section (missing ones turn that section into SKIP):
#   DATABASE_URL        — Supabase Postgres connection string (section A)
#   SUPABASE_PAT        — Supabase Management API token      (section B)
#   HCLOUD_TOKEN        — Hetzner Cloud API token            (section C)
#   VERCEL_TOKEN        — Vercel REST API token              (section D)
#
# Section E (code invariants) always runs with zero secrets.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday 06:00 UTC
  workflow_dispatch:

concurrency:
  group: audit-infra-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: scripts/audit-infra.ts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true # Flip to false once Fase 0 of PRD-ESTABILIZACION is done

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run infra audit
        id: audit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm run audit:infra | tee audit-report.txt

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-infra-report-${{ github.run_id }}
          path: audit-report.txt
          retention-days: 30

      - name: Summary to PR
        if: always() && github.event_name == 'pull_request'
        run: |
          {
            echo "### Infra Audit Report"
            echo ""
            echo '```'
            tail -40 audit-report.txt || echo "(no report)"
            echo '```'
            echo ""
            echo "Non-blocking for now. Flip \`continue-on-error\` in .github/workflows/audit-infra.yml to make required."
          } >> "$GITHUB_STEP_SUMMARY"
