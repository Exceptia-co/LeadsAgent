name: CI/CD - LeadsCRM

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Code Quality & TypeScript Check
  # ============================================================================
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Needed so the auto-format step below can push a commit back to the branch.
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # `push` events arriving from the auto-format commit below still run
          # the workflow — the `[skip ci]` tag in the commit message is what
          # prevents the loop. We still need a token that can push though.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Lint (Fast)
        run: pnpm lint

      - name: TypeScript Check (Ultra-Fast)
        run: pnpm typecheck:fast

      # Auto-format step (replaces the previous blocking Format Check). Runs
      # Prettier in --write mode. If nothing changes, we move on. If something
      # changes AND we're on a `push` to main/develop (not a PR), we commit
      # and push the fix back with "[skip ci]" so the workflow doesn't loop.
      # On PRs we leave the diff uncommitted and let the PR author pull it
      # manually, since pushing to PR branches opened from forks would fail.
      - name: Auto-format (Prettier)
        id: format
        run: |
          pnpm format
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "✅ Code already formatted"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "🎨 Prettier applied formatting changes:"
            git diff --stat
          fi

      - name: Commit auto-format
        if: steps.format.outputs.has_changes == 'true' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(ci): auto-apply Prettier formatting [skip ci]

          Generated by the CI auto-format step in .github/workflows/ci.yml."
          git push origin HEAD:${{ github.ref_name }}

  # ============================================================================
  # Build Matrix - Test Node.js Versions
  # ============================================================================
  build:
    name: Build Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Build (Ultra-Fast) 🚀
        run: pnpm build:fast
        env:
          NODE_ENV: production
          # Clerk requires publishable key for prerendering
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

      - name: Verify build artifacts
        run: |
          echo "✅ Build completed successfully!"
          ls -la apps/*/dist || ls -la apps/*/.next || echo "Build outputs found"

  # ============================================================================
  # Tests
  # ============================================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Run Tests
        run: pnpm test || echo "Tests will be configured later"

      - name: Test Coverage
        run: pnpm test:cov || echo "Coverage will be configured later"

  # ============================================================================
  # Security & Dependency Audit
  # ============================================================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Security Audit
        run: pnpm audit --audit-level high || echo "⚠️ Some vulnerabilities found in dependencies"

      - name: Check for vulnerabilities
        run: |
          echo "🔒 Running security checks..."
          # Add additional security checks here if needed

  # ============================================================================
  # Performance Monitor (Optional)
  # ============================================================================
  performance:
    name: Build Performance Monitor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Measure Build Time 📊
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          echo "⚡ Starting build time measurement..."
          start_time=$(date +%s)
          pnpm build:fast
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          echo "🎯 Build completed in ${duration} seconds"
          echo "💡 Target: < 180 seconds (3 minutes)"
          if [ $duration -gt 300 ]; then
            echo "⚠️  Build time exceeded 5 minutes - optimization needed"
            exit 1
          fi

  # ============================================================================
  # Success Summary
  # ============================================================================
  success:
    name: ✅ All Checks Passed
    runs-on: ubuntu-latest
    needs: [quality, build, test, security]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "🎉 CI/CD Pipeline completed!"
          echo "✅ Code quality: ${{ needs.quality.result }}"
          echo "✅ Build tests: ${{ needs.build.result }}"
          echo "✅ Unit tests: ${{ needs.test.result }}"
          echo "✅ Security: ${{ needs.security.result }}"

          if [[ "${{ needs.quality.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.security.result }}" != "success" ]]; then
            echo "❌ Some checks failed"
            exit 1
          fi

          echo "🚀 Ready for deployment!"

# ============================================================================
# Environment Variables
# ============================================================================
env:
  # Optimize for CI performance
  CI: true
  NODE_ENV: test

  # Turborepo optimizations for CI
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

  # Build optimizations
  NEXT_TELEMETRY_DISABLED: 1
  SKIP_ENV_VALIDATION: 1
