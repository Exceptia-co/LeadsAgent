# Railway configuration for LeadsCRM API
# Root Directory debe estar configurado como "/" en Railway Dashboard

[build]
builder = "nixpacks"
buildCommand = "pnpm install --frozen-lockfile && pnpm db:generate && pnpm build --filter=@leadcrm/api"
# Skip vulnerability scanning - we only deploy the API (NestJS), not the Next.js apps
# The lockfile contains next@14.2.35 which is secure, but Railway cache may show old version
nixpacksSkipVulnerabilityCheck = true

[deploy]
startCommand = "node apps/api/dist/main.js"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[nixpacks]
providers = ["node"]
# Disable vulnerability scanning at nixpacks level
skipVulnerabilityCheck = true

[nixpacks.apt]
# Dependencias adicionales si se necesitan
pkgs = []
