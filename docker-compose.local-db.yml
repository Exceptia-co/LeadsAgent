services:
  postgres:
    image: postgres:16-alpine
    container_name: leadscrm-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: leadcrm_local
      POSTGRES_USER: leadcrm
      POSTGRES_PASSWORD: leadcrm_dev_password
    ports:
      - '15432:5432'
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U leadcrm -d leadcrm_local']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_local_data:
    driver: local
